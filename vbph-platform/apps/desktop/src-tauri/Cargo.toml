[package]
name = "vbph-desktop"
version = "0.1.0"
description = "Virtual Bridge PH Time Tracker"
edition = "2021"

[lib]
name = "vbph_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
xcap = "0.9.8"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
base64 = "0.23.1"
device_query = "4.0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[target.'cfg(target_os = "macos")'.dependencies]
# Only for CGPreflightScreenCaptureAccess/CGRequestScreenCaptureAccess — checking
# and prompting for the Screen Recording permission ahead of a capture attempt.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGWindow"] }
# Only for AXIsProcessTrusted/AXIsProcessTrustedWithOptions — checking and
# prompting for the Accessibility permission device_query needs on macOS.
macos-accessibility-client = "0.0.2"
